# systemd drop-in for the packaged alloy.service, installed as
# /etc/systemd/system/alloy.service.d/homelab.conf by setup-alloy.sh.
#
# The package's own /etc/default/alloy and /etc/alloy/config.alloy are left
# untouched, so `apt full-upgrade` never stops to ask about changed conffiles.
# This extra EnvironmentFile is read after /etc/default/alloy, so its
# CONFIG_FILE (pointing at /etc/alloy/homelab.alloy) wins.

[Unit]
Wants=alloy-tailscaled.service
After=alloy-tailscaled.service

[Service]
EnvironmentFile=/etc/alloy/homelab.env
