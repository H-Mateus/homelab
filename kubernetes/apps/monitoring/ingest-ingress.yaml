---
# Tailscale Ingresses that let collectors OUTSIDE the cluster (Grafana Alloy
# on the TrueNAS boxes, Proxmox hosts, Frigate LXC, ...) push into the
# monitoring stack:
#   https://loki.<tailnet>.ts.net/loki/api/v1/push   (logs)
#   https://prometheus.<tailnet>.ts.net/api/v1/write (metrics, remote-write)
#
# Least privilege: neither backend has auth (Loki auth_enabled: false,
# Prometheus remote-write receiver is unauthenticated), so
#   - only the PUSH path is routed — no queries, UI or admin endpoints;
#     reading still goes through Grafana, and
#   - the devices carry their own tag, so the tailnet policy can allow just
#     the collectors (tag:monitoring-agent) to reach them on 443.
# tag:monitoring-ingest must be owned by tag:k8s-operator in the policy, or
# the operator can't create these devices.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingest
  namespace: monitoring
  annotations:
    tailscale.com/tags: "tag:monitoring-ingest"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /loki/api/v1/push
            pathType: Prefix
            backend:
              service:
                name: loki
                port:
                  number: 3100
  tls:
    - hosts:
        - loki
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingest
  namespace: monitoring
  annotations:
    tailscale.com/tags: "tag:monitoring-ingest"
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /api/v1/write
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-prometheus
                port:
                  number: 9090
  tls:
    - hosts:
        - prometheus
