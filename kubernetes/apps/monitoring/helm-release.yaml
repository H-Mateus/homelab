---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      # Pin to a minor version range so patch releases apply automatically
      # but major/minor bumps require an intentional change here.
      # Run `helm search repo prometheus-community/kube-prometheus-stack --versions`
      # to find the current latest and update this pin over time.
      version: ">=85.0.0 <86.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # --- Grafana ---
    grafana:
      # Admin credentials from SOPS-encrypted secret
      admin:
        existingSecret: grafana-admin-secret
        userKey: adminUser
        passwordKey: adminPassword
      # Ingress is managed by grafana-ingress.yaml (Tailscale IngressClass)
      ingress:
        enabled: false
      persistence:
        enabled: true
        storageClassName: truenas-nfs
        size: 5Gi
      # The PVC is ReadWriteOnce: a rolling update starts the new pod while
      # the old one still holds the volume, and the new pod waits forever on
      # Multi-Attach. Recreate stops the old pod first (brief downtime).
      deploymentStrategy:
        type: Recreate
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: browser
      # Loki (loki-helm-release.yaml); monolithic mode serves the API on the
      # main service.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
      # Community dashboards for the hosts outside the cluster (Alloy pushes
      # node exporter + cAdvisor metrics labelled host=<box>). Downloaded from
      # grafana.com at pod start; pinned revisions, read-only in the UI.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: homelab
              orgId: 1
              folder: Homelab
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/homelab
      dashboards:
        homelab:
          node-exporter-full:
            gnetId: 1860
            revision: 45
            datasource: Prometheus
          cadvisor-exporter:
            gnetId: 14282
            revision: 1
            datasource:
              - name: DS_PROMETHEUS
                value: Prometheus

    # --- Prometheus ---
    prometheus:
      prometheusSpec:
        retention: 30d
        # Safety margin: alert/act before storage is full
        retentionSize: "45GiB"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Collect ServiceMonitors and PodMonitors from ALL namespaces, not
        # just the monitoring namespace. This means future apps that ship
        # a ServiceMonitor will be scraped automatically without any changes
        # to this file.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # Accept pushed metrics at /api/v1/write from Alloy on the boxes
        # outside the cluster (exposed via ingest-ingress.yaml).
        enableRemoteWriteReceiver: true

    # --- Alertmanager ---
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
