---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      # Pin to a minor version range so patch releases apply automatically
      # but major/minor bumps require an intentional change here.
      # Run `helm search repo prometheus-community/kube-prometheus-stack --versions`
      # to find the current latest and update this pin over time.
      version: ">=85.0.0 <86.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # --- Grafana ---
    grafana:
      # Admin credentials from SOPS-encrypted secret
      admin:
        existingSecret: grafana-admin-secret
        userKey: adminUser
        passwordKey: adminPassword
      # Ingress is managed by grafana-ingress.yaml (Tailscale IngressClass)
      ingress:
        enabled: false
      persistence:
        enabled: true
        storageClassName: truenas-nfs
        size: 5Gi
      # The PVC is ReadWriteOnce: a rolling update starts the new pod while
      # the old one still holds the volume, and the new pod waits forever on
      # Multi-Attach. Recreate stops the old pod first (brief downtime).
      deploymentStrategy:
        type: Recreate
      defaultDashboardsEnabled: true
      # Open on the generated "Homelab" overview (dashboards/generate.py),
      # which the dashboard sidecar writes to /tmp/dashboards.
      grafana.ini:
        dashboards:
          default_home_dashboard_path: /tmp/dashboards/homelab-overview.json
      defaultDashboardsTimezone: browser
      # Loki (loki-helm-release.yaml); monolithic mode serves the API on the
      # main service.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.monitoring.svc.cluster.local:3100
          access: proxy
      # Community dashboards for the hosts outside the cluster (Alloy pushes
      # node exporter + cAdvisor metrics labelled host=<box>). Downloaded from
      # grafana.com at pod start; pinned revisions, read-only in the UI.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: homelab
              orgId: 1
              folder: Homelab
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/homelab
      dashboards:
        homelab:
          node-exporter-full:
            gnetId: 1860
            revision: 45
            datasource: Prometheus
          cadvisor-exporter:
            gnetId: 14282
            revision: 1
            datasource:
              - name: DS_PROMETHEUS
                value: Prometheus

    # --- Prometheus ---
    prometheus:
      prometheusSpec:
        retention: 30d
        # Safety margin: alert/act before storage is full
        retentionSize: "45GiB"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 50Gi
        # Collect ServiceMonitors and PodMonitors from ALL namespaces, not
        # just the monitoring namespace. This means future apps that ship
        # a ServiceMonitor will be scraped automatically without any changes
        # to this file.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        # Accept pushed metrics at /api/v1/write from Alloy on the boxes
        # outside the cluster (exposed via ingest-ingress.yaml).
        enableRemoteWriteReceiver: true

    # --- Talos: control-plane components the chart can't scrape ---
    # Talos binds kube-scheduler, kube-controller-manager and kube-proxy
    # metrics to 127.0.0.1, so these targets are permanently "down" and their
    # *InstanceUnreachable / TargetDown alerts would fire forever.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # --- Alertmanager ---
    # Notifications go to a Home Assistant webhook (automation "Homelab –
    # Alertmanager alerts" pushes them to the phone; critical ones break
    # through Do Not Disturb). Watchdog, the always-firing heartbeat, goes to
    # a healthchecks.io check instead, so a dead alerting pipeline alerts too.
    # Both URLs are secrets (anyone holding them can push or silence), so
    # they come from the SOPS secret alertmanager-webhooks via url_file;
    # this config holds no secrets. Alert rules: alert-rules.yaml (metrics),
    # loki-alert-rules.yaml (logs).
    alertmanager:
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: home-assistant
          group_by: [alertname, host, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - receiver: healthchecks
              matchers: ['alertname = "Watchdog"']
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
            # Info-level chart alerts and the InfoInhibitor helper: no push.
            - receiver: "null"
              matchers: ['severity =~ "info|none"']
        inhibit_rules:
          # A critical alert hides the matching warning (same alert, same
          # place). Labels missing on both sides compare equal.
          - source_matchers: ['severity = "critical"']
            target_matchers: ['severity = "warning"']
            equal: [alertname, namespace, host, pool, mountpoint]
        receivers:
          - name: "null"
          - name: home-assistant
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-webhooks/home-assistant
                send_resolved: true
                max_alerts: 10
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-webhooks/healthchecks
                send_resolved: false
      alertmanagerSpec:
        # Mounted at /etc/alertmanager/secrets/alertmanager-webhooks/<key>.
        secrets:
          - alertmanager-webhooks
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: truenas-nfs
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
