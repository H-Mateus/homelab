apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - grafana-admin-secret.sops.yaml
  - grafana-ingress.yaml
  - ingest-ingress.yaml
  - helm-release.yaml
  - loki-helm-release.yaml
  - alertmanager-webhooks.sops.yaml
  - alert-rules.yaml
  - loki-alert-rules.yaml
# Homelab dashboards (generated by dashboards/generate.py). Grafana's
# dashboard sidecar loads any ConfigMap labelled grafana_dashboard=1.
configMapGenerator:
  - name: grafana-dashboards-homelab
    namespace: monitoring
    files:
      - dashboards/homelab-overview.json
      - dashboards/homelab-box.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
