# Frigate config — Home Assistant box (Proxmox LXC).
# Setup + testing steps: ../README.md
# Design rationale: /docs/frigate-camera-project.md
#
# Credentials come from .env via {FRIGATE_RTSP_USER} / {FRIGATE_RTSP_PASSWORD}
# substitution. If the camera password contains RTSP-URL-breaking characters
# (@ : / # ? & + space), URL-encode it in .env, or set an alphanumeric password
# on the camera (safe — cameras sit on an isolated CCTV VLAN). See README.

version: 0.17-0

mqtt:
  enabled: true
  host: "{FRIGATE_MQTT_HOST}" # Home Assistant / Mosquitto host IP (set in .env)
  port: 1883
  user: "{FRIGATE_MQTT_USER}"
  password: "{FRIGATE_MQTT_PASSWORD}"

tls:
  # Serve the UI/API over plain HTTP on 8971 (no self-signed cert). Required for
  # the Home Assistant Frigate integration to connect without cert-validation
  # errors, and fine on a trusted LAN. Re-enable with a real cert / reverse
  # proxy if this is ever exposed beyond the LAN.
  enabled: false

go2rtc:
  # Doorbell is opened ONCE by go2rtc and restreamed to Frigate (record +
  # detect) and to browsers (WebRTC live view with two-way talk). Follows the
  # Reolink recipe in the Frigate docs (configuration/camera_specific):
  #  - http-flv for video+audio (needs HTTP enabled on the camera; if go2rtc
  #    cannot connect, enable RTMP on the camera too),
  #  - a plain RTSP source (NO ffmpeg: prefix) that go2rtc uses for the
  #    talk-back audio channel. "#audio=opus" adds the codec WebRTC needs.
  # Same {FRIGATE_*} substitution as the camera blocks; URL-encode the password
  # if it has special characters (see README).
  streams:
    doorbell:
      - "ffmpeg:http://192.168.30.40/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}#video=copy#audio=copy#audio=opus"
      - "rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.40:554/h264Preview_01_sub"
    doorbell_sub:
      - "ffmpeg:http://192.168.30.40/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}"
  webrtc:
    # Addresses a browser can reach go2rtc's WebRTC port (8555, mapped in
    # docker-compose.yml) on. LAN IP for home, Tailscale IP for remote (fill in
    # once tailscale is installed in the LXC - see README "Two-way talk").
    candidates:
      - 192.168.1.39:8555
      # - 100.x.y.z:8555   # Frigate LXC Tailscale IP
      - stun:8555

detectors:
  ov:
    type: openvino
    device: GPU # Intel HD 530 iGPU — requires /dev/dri passthrough into the LXC

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

detect:
  enabled: true # explicit; per-camera width/height/fps are set in each block below

objects:
  # Only labels the COCO model knows are valid. 'face' is NOT an object label —
  # face recognition is a separate Frigate feature with its own model. Full list:
  # person, bicycle, car, motorcycle, bus, truck, cat, dog, bird, etc.
  track:
    - person
    - car
    - bicycle
    - motorcycle
    - cat
    - dog

ffmpeg:
  # Software decoding on purpose. Frigate 0.16+ AUTO-DETECTS vaapi when this
  # key is absent, and vaapi crashes the doorbell's detect stream in this LXC
  # ("Failed to sync surface" / "Failed to download frame: -5" -> "Unable to
  # read frames from ffmpeg process"). The only streams that get decoded are
  # the 640px substreams (CPU-trivial); main streams are stream-copied for
  # recording. OpenVINO object detection still runs on the iGPU regardless.
  # Frigate's own troubleshooting guide lists `hwaccel_args: []` as the
  # fallback for exactly this error.
  hwaccel_args: []
  output_args:
    # Reolink main-stream audio is AAC, so copy it into recordings (Frigate
    # strips audio by default). Use preset-record-generic-audio-aac if a camera
    # turns out to be PCM/G711 instead.
    record: preset-record-generic-audio-copy

record:
  enabled: true
  # Frigate 0.16 schema: the old `record.retain` block was removed, replaced by
  # `continuous` / `motion` day counts plus per-type alert/detection retention.
  # Sized for the 2 TB single-disk `cctv` pool on TrueNAS mounted at
  # /media/frigate (see docker-compose.yml). Do NOT apply these values while
  # ./media still lives on the 24 GB LXC rootfs - mount the NFS share first.
  # No `continuous` key = 0 days of idle footage; motion-only is plenty.
  motion:
    days: 7
  alerts:
    # person/car/etc inside a camera's `review.alerts.required_zones`
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

# Addressing: cameras live on the isolated CCTV VLAN 30 (pfSense "Cameras"
# interface, 192.168.30.0/24) behind Omada port 1/0/9 (PVID 30, untagged).
# pfSense static DHCP maps by MAC: .40 doorbell  .41 camera_1  .42 camera_2.
# Frigate (LXC 192.168.1.39) and HA (192.168.1.10) reach them via pfSense
# LAN -> VLAN30 rules on 443/554/9000. Rename blocks to install location
# once cameras are mounted.
cameras:
  camera_1: # 192.168.30.41 — confirmed (VLC): 4K H.265 main, 640x360 H.264 sub
    # Not mounted yet (2026-10). Disabled so Frigate doesn't spam ffmpeg
    # reconnect errors for an absent camera; flip to true on install day.
    enabled: false
    ffmpeg:
      inputs:
        # main stream (3840x2160 H.265) -> recording (stream-copied, not re-encoded)
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.41:554/h265Preview_01_main
          roles:
            - record
        # substream (640x360 H.264) -> detection (low-res, cheap to decode)
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.41:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      width: 640
      height: 360
      fps: 5

  doorbell: # 192.168.30.40 — confirmed (VLC): 2560x1920 H.264 main, 640x480 H.264 sub, AAC audio
    ffmpeg:
      inputs:
        # Both roles pull from go2rtc's restream (see go2rtc: above) so the
        # camera is opened once and two-way talk works in the live view.
        - path: rtsp://127.0.0.1:8554/doorbell
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/doorbell_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 480
      fps: 5

  camera_2: # 192.168.30.42 — confirmed (VLC): H.265 main, 640x360 H.264 sub, AAC audio
    # Not mounted yet (2026-10). Disabled so Frigate doesn't spam ffmpeg
    # reconnect errors for an absent camera; flip to true on install day.
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.42:554/h265Preview_01_main
          roles:
            - record
        - path: rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.42:554/h264Preview_01_sub
          roles:
            - detect
    detect:
      width: 640
      height: 360
      fps: 5
