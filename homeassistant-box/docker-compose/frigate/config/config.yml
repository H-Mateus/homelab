# Frigate config — Home Assistant box (Proxmox LXC).
# Setup + testing steps: ../README.md
# Design rationale: /docs/frigate-camera-project.md
#
# Credentials come from .env via {FRIGATE_RTSP_USER} / {FRIGATE_RTSP_PASSWORD}
# substitution. If the camera password contains RTSP-URL-breaking characters
# (@ : / # ? & + space), URL-encode it in .env, or set an alphanumeric password
# on the camera (safe — cameras sit on an isolated CCTV VLAN). See README.

version: 0.18-0

mqtt:
  enabled: true
  host: '{FRIGATE_MQTT_HOST}' # Home Assistant / Mosquitto host IP (set in .env)
  port: 1883
  user: '{FRIGATE_MQTT_USER}'
  password: '{FRIGATE_MQTT_PASSWORD}'

tls:
  # Serve the UI/API over plain HTTP on 8971 (no self-signed cert). Required for
  # the Home Assistant Frigate integration to connect without cert-validation
  # errors, and fine on a trusted LAN. Re-enable with a real cert / reverse
  # proxy if this is ever exposed beyond the LAN.
  enabled: false

go2rtc:
  # Doorbell is opened ONCE by go2rtc and restreamed to Frigate (record +
  # detect) and to browsers (WebRTC live view with two-way talk). Follows the
  # Reolink recipe in the Frigate docs (configuration/camera_specific):
  #  - http-flv for video+audio (needs HTTP enabled on the camera; if go2rtc
  #    cannot connect, enable RTMP on the camera too),
  #  - a plain RTSP source (NO ffmpeg: prefix) that go2rtc uses for the
  #    talk-back audio channel. "#audio=opus" adds the codec WebRTC needs.
  # Same {FRIGATE_*} substitution as the camera blocks; URL-encode the password
  # if it has special characters (see README).
  streams:
    doorbell:
      - ffmpeg:http://192.168.30.40/flv?port=1935&app=bcs&stream=channel0_main.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}#video=copy#audio=copy#audio=opus
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.40:554/h264Preview_01_sub
    doorbell_sub:
      - ffmpeg:http://192.168.30.40/flv?port=1935&app=bcs&stream=channel0_ext.bcs&user={FRIGATE_RTSP_USER}&password={FRIGATE_RTSP_PASSWORD}
    # Rear floodlight: RTSP, not http-flv (flv can't carry its H.265 main).
    # Frigate's record/detect feeds get #backchannel=0 so go2rtc doesn't hold
    # the camera's speaker channel 24/7 (which would block talk from the
    # Reolink app / HA). rear_floodlight_talk is opened only while someone
    # watches live: H.264 sub + backchannel, AAC transcoded to opus for WebRTC.
    rear_floodlight:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.43:554/h265Preview_01_main#backchannel=0
    rear_floodlight_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.43:554/h264Preview_01_sub#backchannel=0
    rear_floodlight_talk:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.43:554/h264Preview_01_sub
      - ffmpeg:rear_floodlight_talk#audio=opus
    # Side-passage PTZs (E1 Outdoor SE): same pattern as rear_floodlight.
    driveway:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.41:554/h265Preview_01_main#backchannel=0
    driveway_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.41:554/h264Preview_01_sub#backchannel=0
    driveway_talk:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.41:554/h264Preview_01_sub
      - ffmpeg:driveway_talk#audio=opus
    side_alley:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.42:554/h265Preview_01_main#backchannel=0
    side_alley_sub:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.42:554/h264Preview_01_sub#backchannel=0
    side_alley_talk:
      - rtsp://{FRIGATE_RTSP_USER}:{FRIGATE_RTSP_PASSWORD}@192.168.30.42:554/h264Preview_01_sub
      - ffmpeg:side_alley_talk#audio=opus
  webrtc:
    # Addresses a browser can reach go2rtc's WebRTC port (8555, mapped in
    # docker-compose.yml) on. The sidecar shares Frigate's netns, so its
    # Tailscale IP lands on the same 8555 (see README "Two-way talk").
    candidates:
      - 192.168.1.39:8555 # LXC LAN IP - browsers at home
      - 100.107.54.14:8555 # frigate-ts sidecar Tailscale IP - browsers on the tailnet
      - stun:8555

detectors:
  ov:
    type: openvino
    # CPU, not the Intel HD 530 iGPU: the i915 GPU hung on 2026-10-25 (dmesg
    # "GPU HANG ... Resetting rcs0" every 3 s) and the detector stalled with it,
    # so Frigate was blind for 3 days. A container restart can't reset the GPU.
    # ssdlite_mobilenet_v2 on 4 cores is fine for 4 cameras at 5 fps with
    # motion-gated detection. Switch back to GPU only after a host reboot.
    device: CPU

model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

detect:
  enabled: true # explicit; per-camera width/height/fps are set in each block below

objects:
  # Only labels the COCO model knows are valid. 'face' is NOT an object label —
  # face recognition is a separate Frigate feature with its own model. Full list:
  # person, bicycle, car, motorcycle, bus, truck, cat, dog, bird, etc.
  track:
    - person
    - car
    - bicycle
    - motorcycle
    - cat
    - dog

ffmpeg:
  # Software decoding on purpose. Frigate 0.16+ AUTO-DETECTS vaapi when this
  # key is absent, and vaapi crashes the doorbell's detect stream in this LXC
  # ("Failed to sync surface" / "Failed to download frame: -5" -> "Unable to
  # read frames from ffmpeg process"). The only streams that get decoded are
  # the 640px substreams (CPU-trivial); main streams are stream-copied for
  # recording. OpenVINO object detection still runs on the iGPU regardless.
  # Frigate's own troubleshooting guide lists `hwaccel_args: []` as the
  # fallback for exactly this error.
  hwaccel_args: []
  output_args:
    # Reolink main-stream audio is AAC, so copy it into recordings (Frigate
    # strips audio by default). Use preset-record-generic-audio-aac if a camera
    # turns out to be PCM/G711 instead.
    record: preset-record-generic-audio-copy

record:
  enabled: true
  # Frigate 0.16 schema: the old `record.retain` block was removed, replaced by
  # `continuous` / `motion` day counts plus per-type alert/detection retention.
  # Sized for the 2 TB single-disk `cctv` pool on TrueNAS mounted at
  # /media/frigate (see docker-compose.yml). Do NOT apply these values while
  # ./media still lives on the 24 GB LXC rootfs - mount the NFS share first.
  # No `continuous` key = 0 days of idle footage; motion-only is plenty.
  motion:
    days: 7
  alerts:
    # person/car/etc inside a camera's `review.alerts.required_zones`
    retain:
      days: 30
      mode: motion
  detections:
    retain:
      days: 14
      mode: motion

snapshots:
  enabled: true
  retain:
    default: 14

# Addressing: cameras live on the isolated CCTV VLAN 30 (pfSense "Cameras"
# interface, 192.168.30.0/24) behind Omada port 1/0/9 (PVID 30, untagged).
# pfSense static DHCP maps by MAC: .40 doorbell  .41 driveway  .42 side_alley
# .43 rear_floodlight.
# Frigate (LXC 192.168.1.39) and HA (192.168.1.10) reach them via pfSense
# LAN -> VLAN30 rules on 443/554/9000.
cameras:
  driveway: # 192.168.30.41 — E1 Outdoor SE PoE (pan/tilt), side of house, front end. Mounted 2026-10.
    # Confirmed (VLC): 4K H.265 main, 640x360 H.264 sub.
    # Pan/tilt tracking is the CAMERA's own auto-tracking, not Frigate's:
    # Frigate autotracking needs ONVIF FOV RelativeMove, which no Reolink PTZ
    # implements. Handoff with side_alley is done by HA automations, not here.
    ffmpeg:
      inputs:
        # Via the go2rtc restream (see go2rtc: above): 4K H.265 main ->
        # record (stream-copied), 640x360 H.264 sub -> detect.
        - path: rtsp://127.0.0.1:8554/driveway
          input_args: preset-rtsp-restream
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/driveway_sub
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      width: 640
      height: 360
      fps: 5
    live:
      # H.264 sub + backchannel; the 4K H.265 main won't play in most browsers.
      streams:
        Live + talk: driveway_talk

    # Alerts (and so the HA "nobody home" push) only for inner_driveway, the
    # half nearest the house. Neighbours walking past clipped the outer edge of
    # driveway_zone, so it, the grass, pavement and road stay detections
    # (recorded, no push).
    review:
      alerts:
        required_zones:
          - inner_driveway
    zones:
      pavement_approach:
        coordinates: 0.249,0.243,0.052,0.191,0.056,0.152,0.254,0.152
        enabled: true
        inertia: 3
        loitering_time: 0
        friendly_name: Pavement approach
      road:
