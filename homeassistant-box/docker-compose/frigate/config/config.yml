          0.176,0.337,0.782,0.679,0.741,0.994,0.005,0.992,0.002,0.218,0.042,0.186,0.078,0.445
        enabled: true
        inertia: 3
        loitering_time: 0
      # Same outline as inner_driveway, but a person only counts as in it
      # after 45 s. Not an alert zone: HA watches it for the night-time
