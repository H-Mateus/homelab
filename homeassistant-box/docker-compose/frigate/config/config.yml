        friendly_name: Driveway zone
    # Football pitch: behind a tall fence, no way onto the property, so it is
    # masked out entirely - no motion (detection or motion recording) and no
    # tracked objects there.
      neighbor_driveway:
        coordinates: 0.89,0.438,0.884,0.996,0.997,0.998,0.997,0.504
        enabled: true
        inertia: 3
        loitering_time: 0
        friendly_name: Neighbor driveway
      inner_driveway:
