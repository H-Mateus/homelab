services:
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    # tmpfs cache lives in shm; bump this up as cameras are added
    # (rough guide: ~50MB + (width*height*1.5*9 per camera)). 256mb suits a few.
    shm_size: "256mb"
    env_file: .env
    cap_add:
      - CAP_PERFMON # lets Frigate read Intel iGPU stats (fixes "Failed to initialize PMU")
    devices:
      - /dev/dri/renderD128 # Intel HD 530 iGPU: OpenVINO detection + VAAPI decode
      # - /dev/bus/usb       # uncomment when the Coral USB TPU is fitted
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config:/config
      # Recordings/snapshots on the TrueNAS `cctv` pool (single 2 TB disk) over
      # NFS, mounted inside this (privileged) LXC at /mnt/cctv via fstab — see
      # README "Storage". The SQLite DB
      # stays in ./config on the local disk - SQLite on NFS corrupts/locks.
      - /mnt/cctv:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    # No ports: here - Frigate shares the frigate-ts sidecar's network namespace
    # (network_mode below), so the published ports live on that service.
    network_mode: service:frigate-ts
    depends_on:
      - frigate-ts

  # Tailscale sidecar: gives Frigate an HTTPS URL on the tailnet
  # (https://frigate.<tailnet>.ts.net) with a valid cert, which browsers need
  # before they will hand over the microphone for two-way talk; also = remote
  # access to the Frigate UI without going through HA.
  #
  # Same shape as the TrueNAS stacks: the sidecar OWNS the network namespace
  # and publishes the ports; Frigate joins it (network_mode: service:frigate-ts).
  # This direction matters: Frigate is restarted on every config change, and a
  # container that joins another's netns loses networking when the owner
  # restarts. The sidecar restarts rarely (image updates), and when it does,
  # `docker compose up -d` recreates Frigate with it.
  #
  # One difference from TrueNAS: kernel networking (NET_ADMIN + /dev/net/tun)
  # instead of TS_USERSPACE, because WebRTC media is UDP to go2rtc on 8555 via
  # the Tailscale IP. The LXC exposes /dev/net/tun (added in its pve conf).
  frigate-ts:
    container_name: frigate-ts
    image: tailscale/tailscale:latest
    hostname: frigate
    environment:
      - "TS_AUTHKEY=${TS_AUTHKEY}"
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./ts-state/frigate:/var/lib/tailscale
      # serve.json in a real directory, not a Compose `configs:` single-file
      # mount — containerboot fsnotify-watches it (see truenas stacks).
      - ./ts-config/frigate:/config
    ports:
      # Published here on behalf of Frigate (shared netns). Same LAN IP:port as
      # before, so the HA integration at http://192.168.1.39:8971 is unchanged.
      - "8971:8971"      # Frigate authenticated web UI / API (plain HTTP, LAN)
      - "8554:8554"      # RTSP restream (go2rtc)
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC
    restart: unless-stopped
