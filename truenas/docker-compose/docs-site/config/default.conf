# Static Quarto site from the docs-html branch. Reached only via the
# Tailscale sidecar (serve.json proxies to 127.0.0.1:8080), which also
# terminates TLS.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Dotfiles (e.g. a stray .git) are never served.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Quarto fingerprints nothing, so keep caching short; pages change on
    # every push to main.
    location ~* \.(css|js|woff2?|svg|png|avif|jpg)$ {
        expires 1h;
    }
}
