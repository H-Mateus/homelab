#
# ImmichFrame slideshow, exposed only via Tailscale as a dedicated device.
#
# Architecture
# ------------
# ImmichFrame talks to the Immich SERVER's HTTP API (ImmichServerUrl + ApiKey),
# not to Postgres. The `immich` stack now runs on this same Docker host with no
# host ports (Tailnet-only), so ImmichFrame reaches it EAST-WEST over Immich's
# Compose network instead of over the tailnet:
#
#   - The immichframe-family-ts sidecar joins the external `immich_default`
#     network (created by the `immich` stack, project name `immich`).
#   - immichframe-family shares that sidecar's netns (network_mode: service:...),
#     so it resolves `immich-server` via Docker DNS and dials it directly on 2283.
#
# We do NOT point ImmichServerUrl at the Immich tailnet name: the sidecar runs
# in TS_USERSPACE mode, where outbound tailnet traffic would have to go through
# tailscaled's SOCKS5/HTTP proxy. Direct Docker networking avoids that entirely.
# The sidecar's `tailscale serve` is only for INBOUND access to the frame UI.
#
# Requires Immich v3.3.0+ (ImmichFrame v1.0.40.0). Image is pinned for reproducibility.
#
# Configuration
# -------------
# Since v1.0.38.0 ImmichFrame ignores settings env vars (ImmichServerUrl=...,
# ApiKey=..., etc.) and instead keeps settings in a DB edited via /admin. We opt
# out with IMMICHFRAME_CONFIG_SOURCE=file (v1.0.40.0+): Settings.yml is the only
# source of truth, read once at startup, and /admin is off. The file is defined
# inline below via `configs: content:` so Compose interpolates secrets from .env.
# An unknown key or invalid file stops startup -- check the logs after edits.

services:
  immichframe-family:
    container_name: immichframe-family
    image: ghcr.io/immichframe/immichframe:v1.0.40.0
    network_mode: service:immichframe-family-ts
    environment:
      - TZ=Europe/London
      # Settings come ONLY from the Settings.yml below; the /admin UI and its
      # SQLite DB are disabled. Edit the config, then recreate the container.
      - IMMICHFRAME_CONFIG_SOURCE=file
    configs:
      - source: immichframe-settings
        target: /app/Config/Settings.yml
    depends_on:
      - immichframe-family-ts
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
  immichframe-family-ts:
    container_name: immichframe-family-ts
    image: tailscale/tailscale:v1.104.7
    hostname: immichframe-family
    environment:
      - "TS_AUTHKEY=${TS_AUTHKEY}"
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=true
    volumes:
      - ./ts-state/immichframe-family:/var/lib/tailscale
      # serve.json as a committed file in a real directory (not a Compose
      # `configs:` single-file mount). containerboot fsnotify-watches this path
      # to hot-reload; a single-file mount isn't reliably watchable and makes
      # the sidecar crash-loop after an image update with
      # "serve proxy: failed to add fsnotify watch: no such file or directory".
      - ./ts-config/immichframe-family:/config
    networks:
      - default
      - immich_default
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

configs:
  immichframe-settings:
    content: |
      General:
        PrimaryColor: '#FFFFFF'
        ClockFormat: 'HH:mm'
        PhotoDateFormat: 'yyyy-MM-dd'
        ShowAlbumName: false
        ShowPeopleDesc: false
        ShowWeatherDescription: true
        WeatherApiKey: '${WEATHER_API_KEY}'
        WeatherLatLong: '51.5074,-0.1278'
        UnitSystem: metric # 'imperial' | 'metric'
        # Hours between re-pulling the album/person asset lists from Immich.
        RefreshAlbumPeopleInterval: 1
      Accounts:
        # Reaches immich-server over the shared immich_default network (see header).
        - ImmichServerUrl: '${IMMICH_URL}'
          ApiKey: '${IMMICH_API_KEY}'
          Albums:
            - 470366b8-1617-413d-b349-4d88c85554a8

networks:
  # The Immich stack's Compose network (project `immich`). Must be up first.
  immich_default:
    external: true
