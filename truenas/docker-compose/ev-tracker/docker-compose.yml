#
# EV tracker: checks AutoTrader once a day for used EVs near Cardiff, scores
# them, sends Telegram alerts and serves a ranking page at
# https://ev.<tailnet>.ts.net. Source + image (private):
# https://github.com/H-Mateus/ev-price-tracker
#
# Networking
# ----------
# Same pattern as uptime-kuma/homepage: the tracker shares a kernel-mode
# sidecar's network namespace. It serves the page on 127.0.0.1:8080, which
# serve.json proxies to; no `ports:`, so Tailnet-only. Kernel mode + MagicDNS
# also let it reach Kuma's push URL by its ts.net name. AutoTrader and
# Telegram traffic goes out over the normal internet connection.
#
# Storage
# -------
# SQLite + the generated page under ${EVTRACKER_ROOT}, a local dataset (SQLite
# over NFS corrupts). Non-secret settings are ./config/config.toml
# (committed); secrets come from .env as environment variables.

name: ev-tracker

services:
  ev-tracker:
    container_name: ev-tracker
    image: ghcr.io/h-mateus/ev-price-tracker:${EVTRACKER_VERSION:-latest}
    command: ["evtracker", "daemon", "--at", "${EVTRACKER_RUN_AT:-08:30}", "--serve", "8080"]
    network_mode: service:ev-tracker-ts
    user: "568:568"
    volumes:
      - ${EVTRACKER_ROOT}:/data
      - ./config:/config:ro
    environment:
      TZ: ${TZ:-Europe/London}
      EVTRACKER_SITE_URL: ${EVTRACKER_SITE_URL:-}
      EVTRACKER_TELEGRAM_TOKEN: ${EVTRACKER_TELEGRAM_TOKEN:-}
      EVTRACKER_TELEGRAM_CHAT_ID: ${EVTRACKER_TELEGRAM_CHAT_ID:-}
      EVTRACKER_EMAIL_PASSWORD: ${EVTRACKER_EMAIL_PASSWORD:-}
      EVTRACKER_PUSH_URL: ${EVTRACKER_PUSH_URL:-}
    depends_on:
      - ev-tracker-ts
    mem_limit: 256m
    restart: unless-stopped

  ev-tracker-ts:
    container_name: ev-tracker-ts
    image: tailscale/tailscale:v1.104.7
    hostname: ev-tracker-ts
    environment:
      - "TS_AUTHKEY=${TS_AUTHKEY}"
      - TS_HOSTNAME=${TS_HOSTNAME:-ev}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      # Kernel mode + MagicDNS: see header.
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=true
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - ./ts-state/ev-tracker:/var/lib/tailscale
      # Plain bind mount, not Compose `configs:` (Dockhand recreates drop them).
      - ./ts-config/ev-tracker:/config
    mem_limit: 128m
    restart: unless-stopped
