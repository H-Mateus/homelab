- Home:
    - Home Assistant:
        icon: home-assistant.svg
        href: https://homeassistant.fairy-featherback.ts.net
        description: Automations, energy, alarm
        siteMonitor: https://homeassistant.fairy-featherback.ts.net
        # Plain `state` lookups only: Homepage renders `template` items via
        # HA's /api/template, which is admin-only, and the token belongs to
        # a non-admin user. Max four custom items.
        widget:
          type: homeassistant
          url: https://homeassistant.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - state: sensor.sigen_plant_battery_state_of_charge
              label: battery
              value: "{state}%"
            - state: sensor.sigen_plant_daily_pv_energy
              label: solar today
            - state: sensor.sigen_plant_daily_load_consumption
              label: used today
            - state: alarm_control_panel.alarmo
              label: alarm
              value: "{state}"
    - Paperless:
        icon: paperless-ngx.svg
        href: https://paperless.fairy-featherback.ts.net
        description: Documents
        siteMonitor: https://paperless.fairy-featherback.ts.net
        widget:
          type: paperlessngx
          url: https://paperless.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"
    - Frigate:
        icon: frigate.svg
        # Authenticated UI, also served on 443 at the tailnet name, so no
        # extra port in the grant. Logs in as a viewer-role `homepage` user.
        href: https://frigate.fairy-featherback.ts.net
        description: CCTV
        siteMonitor: https://frigate.fairy-featherback.ts.net
        widget:
          type: frigate
          url: https://frigate.fairy-featherback.ts.net
          username: homepage
          password: "{{HOMEPAGE_VAR_FRIGATE_PASSWORD}}"
          enableRecentEvents: true

- Infrastructure:
    - TrueNAS:
        icon: truenas-scale.svg
        href: https://truenas-local.fairy-featherback.ts.net
        description: Primary NAS
        siteMonitor: https://truenas-local.fairy-featherback.ts.net
        widget:
          type: truenas
          url: https://truenas-local.fairy-featherback.ts.net
          version: 2
          key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"
          enablePools: true
    - TrueNAS off-site:
        icon: truenas-scale.svg
        href: https://truenas-white.fairy-featherback.ts.net
        description: Off-site replication target
    # Each host runs `tailscale serve --bg https+insecure://localhost:8006`,
    # so the UI is on 443 at its MagicDNS name with a valid cert (the
    # self-signed :8006 hop stays on the box). Token: homepage@pve!homepage,
    # PVEAuditor on /, one per host.
    - Proxmox:
        icon: proxmox.svg
        href: https://proxmox.fairy-featherback.ts.net
        description: Talos cluster host
        siteMonitor: https://proxmox.fairy-featherback.ts.net
        widget:
          type: proxmox
          url: https://proxmox.fairy-featherback.ts.net
          username: homepage@pve!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
    - Proxmox HA:
        icon: proxmox.svg
        href: https://proxmox-homeassistant.fairy-featherback.ts.net
        description: Home Assistant + Frigate host
        siteMonitor: https://proxmox-homeassistant.fairy-featherback.ts.net
        widget:
          type: proxmox
          url: https://proxmox-homeassistant.fairy-featherback.ts.net
          username: homepage@pve!homepage
          password: "{{HOMEPAGE_VAR_PROXMOX_HA_TOKEN}}"
    - pfSense:
        icon: pfsense.svg
        href: https://pfsense.fairy-featherback.ts.net
        description: Router & firewall

