# Widget docs: https://gethomepage.dev/widgets/services/
# Keys come from Dockhand's .env as {{HOMEPAGE_VAR_*}}; never paste a key here.
# Every HOMEPAGE_VAR_* used below must also be listed under `environment:` in
# docker-compose.yml (Dockhand doesn't write a .env file, so no env_file).
#
# Every app sidecar serves HTTPS on 443 at its MagicDNS name, so widgets and
# siteMonitor use the same tailnet URL as the link. siteMonitor (a status
# dot) needs the target's tag in the tag:homepage grant; tiles without one
# are link-only (self-signed cert, non-443 port, or off-site box).

- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.fairy-featherback.ts.net
        description: Films & TV
        siteMonitor: https://jellyfin.fairy-featherback.ts.net
        widget:
          type: jellyfin
          url: https://jellyfin.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          # Jellyfin >= 10.12 dropped the /emby routes v1 uses (404s).
          version: 2
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        icon: jellyseerr.svg
        href: https://seerr.fairy-featherback.ts.net
        description: Requests
        siteMonitor: https://seerr.fairy-featherback.ts.net
        widget:
          type: seerr
          url: https://seerr.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
    - Immich:
        icon: immich.svg
        href: https://immich-family.fairy-featherback.ts.net
        description: Family photos
        siteMonitor: https://immich-family.fairy-featherback.ts.net
        widget:
          type: immich
          url: https://immich-family.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
    - Navidrome:
        icon: navidrome.svg
        href: https://navidrome.fairy-featherback.ts.net
        description: Music streaming
        siteMonitor: https://navidrome.fairy-featherback.ts.net
        # Subsonic auth: token = md5(password + salt), for a non-admin
        # `homepage` Navidrome user. Shows what's playing.
        widget:
          type: navidrome
          url: https://navidrome.fairy-featherback.ts.net
          user: homepage
          token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
          salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"

