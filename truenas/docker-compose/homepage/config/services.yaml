# Widget docs: https://gethomepage.dev/widgets/services/
# Keys come from Dockhand's .env as {{HOMEPAGE_VAR_*}}; never paste a key here.
# Every HOMEPAGE_VAR_* used below must also be listed under `environment:` in
# docker-compose.yml (Dockhand doesn't write a .env file, so no env_file).
#
# Every app sidecar serves HTTPS on 443 at its MagicDNS name, so widgets use
# the same tailnet URL as the link. Entries without a widget are link-only:
# they'd need extra credentials, a self-signed cert or a non-443 port.

- Media:
    - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.fairy-featherback.ts.net
        widget:
          type: jellyfin
          url: https://jellyfin.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          # Jellyfin >= 10.12 dropped the /emby routes v1 uses (404s).
          version: 2
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        icon: jellyseerr.svg
        href: https://seerr.fairy-featherback.ts.net
        widget:
          type: seerr
          url: https://seerr.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"
    - Immich:
        icon: immich.svg
        href: https://immich-family.fairy-featherback.ts.net
        widget:
          type: immich
          url: https://immich-family.fairy-featherback.ts.net
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
    - ImmichFrame:
        icon: immich.svg
        href: https://immichframe-family.fairy-featherback.ts.net
    - Navidrome:
        icon: navidrome.svg
        href: https://navidrome.fairy-featherback.ts.net
        # Widget needs user + Subsonic token/salt; link-only for now.

